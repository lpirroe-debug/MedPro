<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de bandejas — CEYE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#F5F7F6;
    --surface:#FFFFFF;
    --ink:#16302E;
    --muted:#5F7472;
    --teal:#0F4C4C;
    --teal-dark:#0A3838;
    --steel:#3D7A8C;
    --line:#D8E1DF;
    --implant:#B3423A;
    --implant-bg:#FBEBEA;
    --radius:10px;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Consolas", "Menlo", "IBM Plex Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px;}

  header.app-header{
    display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:18px;margin-bottom:22px;border-bottom:2px solid var(--teal);
  }
  header.app-header h1{
    font-size:19px;letter-spacing:.01em;margin:0;color:var(--teal-dark);font-weight:700;
  }
  header.app-header .eyebrow{
    font-family:var(--font-mono);font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:2px;
  }
  header.app-header .count{
    font-family:var(--font-mono);font-size:13px;color:var(--steel);white-space:nowrap;
  }

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;margin-bottom:20px;
  }
  .card h2{font-size:14px;margin:0 0 16px;color:var(--teal-dark);letter-spacing:.02em;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;
  }
  .field input[type=text], .field input[type=number], .field select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;
    font-size:14px;font-family:var(--font-ui);color:var(--ink);background:#fff;
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(61,122,140,.15);
  }
  .field.code input{font-family:var(--font-mono);letter-spacing:.08em;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .hint.err{color:var(--implant);}

  .implant-toggle{display:flex;gap:8px;}
  .implant-toggle button{
    flex:1;padding:10px;border-radius:7px;border:1px solid var(--line);background:#fff;
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font-ui);
  }
  .implant-toggle button.active[data-v="N"]{background:#EAF3F1;border-color:var(--steel);color:var(--teal-dark);}
  .implant-toggle button.active[data-v="S"]{background:var(--implant-bg);border-color:var(--implant);color:var(--implant);}

  .btn{
    appearance:none;border:none;border-radius:7px;padding:11px 18px;font-size:14px;font-weight:700;
    cursor:pointer;font-family:var(--font-ui);letter-spacing:.01em;
  }
  .btn-primary{background:var(--teal);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-secondary{background:#fff;color:var(--teal-dark);border:1px solid var(--teal);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-danger-text{background:transparent;color:var(--implant);border:none;font-size:12px;font-weight:600;cursor:pointer;padding:4px 6px;}

  .confirm{
    display:none;margin-top:14px;padding:14px;border-radius:7px;background:#EAF3F1;
    border:1px solid var(--steel);
  }
  .confirm.show{display:block;}
  .confirm p{margin:0 0 12px;font-size:13px;color:var(--teal-dark);}
  .confirm .actions{display:flex;gap:10px;}
  .confirm .actions .btn{flex:1;}

  /* manifest list */
  .manifest-item{
    display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);
  }
  .manifest-item:last-child{border-bottom:none;}
  .manifest-item .num{
    font-family:var(--font-mono);font-size:12px;color:var(--muted);width:20px;flex-shrink:0;
  }
  .manifest-item .thumb{width:44px;height:44px;flex-shrink:0;}
  .manifest-item .thumb img{width:100%;height:100%;display:block;border-radius:4px;border:1px solid var(--line);}
  .manifest-item .meta{flex:1;min-width:0;}
  .manifest-item .meta .name{font-size:13.5px;font-weight:600;color:var(--ink);}
  .manifest-item .meta .sub{
    font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px;
  }
  .manifest-item .meta .sub .code{color:var(--steel);}
  .manifest-item .flag{
    font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;
  }
  .manifest-item .flag.implant{background:var(--implant-bg);color:var(--implant);}
  .manifest-item .flag.noimplant{background:#EEF2F1;color:var(--muted);}

  .empty-state{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px;}

  .footer-actions{display:flex;gap:10px;margin-top:6px;}
  .footer-actions .btn{flex:1;}

  /* print view */
  #printView{display:none;}
  #printView.show{display:block;}
  #printView .doc-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--teal);padding-bottom:12px;margin-bottom:18px;
  }
  #printView .doc-head h1{font-size:18px;margin:0;color:var(--teal-dark);}
  #printView .doc-head .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:right;}
  table.doc-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.doc-table th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);border-bottom:2px solid var(--teal);padding:6px 8px;font-weight:700;
  }
  table.doc-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.doc-table td.code{font-family:var(--font-mono);color:var(--steel);}
  table.doc-table td.qr img{width:46px;height:46px;display:block;}
  table.doc-table tr td.implant-yes{color:var(--implant);font-weight:700;}

  @media print{
    body *{visibility:hidden;}
    #printView, #printView *{visibility:visible;}
    #printView{position:absolute;left:0;top:0;width:100%;display:block !important;}
    .no-print{display:none !important;}
  }

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap" id="formView">
  <header class="app-header">
    <div>
      <span class="eyebrow">Pacífica Salud · CEYE</span>
      <h1>Registro de bandejas para lavado</h1>
    </div>
    <div class="count" id="countLabel">0 registradas</div>
  </header>

  <div class="card">
    <h2>Datos del instrumental</h2>

    <div class="field code">
      <label for="f-codigo">Código (6 dígitos)</label>
      <input type="text" id="f-codigo" maxlength="6" inputmode="numeric" placeholder="012345">
      <div class="hint" id="hint-codigo"></div>
    </div>

    <div class="field">
      <label for="f-nombre">Nombre del instrumental</label>
      <input type="text" id="f-nombre" placeholder="Bandeja Cesárea">
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-cantidad">Cantidad de instrumentos</label>
        <input type="number" id="f-cantidad" min="1" placeholder="24">
      </div>
      <div class="field">
        <label for="f-lavado">Método de lavado</label>
        <select id="f-lavado">
          <option value="M">M — Manual</option>
          <option value="MU">MU — Manual + Ultrasonido</option>
          <option value="MUT">MUT — Manual + Ultrasonido + Térmico</option>
          <option value="MT">MT — Manual + Térmico</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-esteril">Método de esterilización</label>
        <select id="f-esteril">
          <option value="AUTOCLAVE">Autoclave</option>
          <option value="STERRAD">Sterrad</option>
        </select>
      </div>
      <div class="field">
        <label>Contiene implantes</label>
        <div class="implant-toggle">
          <button type="button" data-v="N" class="active" onclick="setImplant('N')">No</button>
          <button type="button" data-v="S" onclick="setImplant('S')">Sí</button>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="agregarInstrumento()">Agregar instrumento</button>

    <div class="confirm" id="confirmBox">
      <p id="confirmText"></p>
      <div class="actions">
        <button class="btn btn-secondary" onclick="hideConfirm()">➕ Agregar otro instrumento</button>
        <button class="btn btn-primary" onclick="irADocumento()">✅ Terminar y generar documento</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Bandejas registradas en esta sesión</h2>
    <div id="manifest"></div>
    <div class="empty-state" id="emptyState">Todavía no agregas ninguna bandeja.</div>
  </div>

  <div class="footer-actions" id="footerActions" style="display:none;">
    <button class="btn btn-secondary" onclick="irADocumento()">Generar documento con QR</button>
  </div>
</div>

<div class="wrap" id="printView">
  <div class="doc-head">
    <div>
      <span class="eyebrow" style="display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">Pacífica Salud · CEYE</span>
      <h1>Bandejas ingresadas a lavado</h1>
    </div>
    <div class="meta" id="docMeta"></div>
  </div>

  <table class="doc-table">
    <thead>
      <tr>
        <th>Código</th>
        <th>Instrumental</th>
        <th>Cant.</th>
        <th>Lavado</th>
        <th>Esteril.</th>
        <th>Implantes</th>
        <th>QR</th>
      </tr>
    </thead>
    <tbody id="docTableBody"></tbody>
  </table>

  <div class="no-print" style="margin-top:24px;display:flex;gap:10px;">
    <button class="btn btn-secondary" onclick="volverAlFormulario()">← Volver al formulario</button>
    <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
    <button class="btn btn-ghost" onclick="descargarHTML()">Descargar como HTML</button>
  </div>
</div>

<div id="qrScratch" style="position:absolute;left:-9999px;top:-9999px;"></div>

<script>
let items = [];
let implantValue = "N";

function setImplant(v){
  implantValue = v;
  document.querySelectorAll('.implant-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.v === v);
  });
}

function limpiarNombreParaQR(nombre){
  return nombre
    .toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,''); // quita acentos
}

function construirPayload(d){
  const cod = d.codigo.padStart(6,'0');
  return [cod, limpiarNombreParaQR(d.nombre), d.cantidad, d.lavado, d.esteril, d.implantes].join('*');
}

function generarQRDataURL(texto, tam){
  return new Promise((resolve)=>{
    const scratch = document.getElementById('qrScratch');
    scratch.innerHTML = '';
    new QRCode(scratch, {
      text: texto,
      width: tam, height: tam,
      correctLevel: QRCode.CorrectLevel.M
    });
    setTimeout(()=>{
      const canvas = scratch.querySelector('canvas');
      const url = canvas ? canvas.toDataURL('image/png') : '';
      resolve(url);
    }, 60);
  });
}

async function agregarInstrumento(){
  const codigo = document.getElementById('f-codigo').value.trim();
  const nombre = document.getElementById('f-nombre').value.trim();
  const cantidad = document.getElementById('f-cantidad').value.trim();
  const lavado = document.getElementById('f-lavado').value;
  const esteril = document.getElementById('f-esteril').value;
  const hint = document.getElementById('hint-codigo');

  hint.textContent = '';
  hint.classList.remove('err');

  if(!/^\d{1,6}$/.test(codigo)){
    hint.textContent = 'El código debe tener hasta 6 dígitos numéricos.';
    hint.classList.add('err');
    return;
  }
  if(!nombre){
    alert('Escribe el nombre del instrumental.');
    return;
  }
  if(!cantidad || parseInt(cantidad) < 1){
    alert('Escribe la cantidad de instrumentos.');
    return;
  }

  const d = { codigo, nombre, cantidad: parseInt(cantidad), lavado, esteril, implantes: implantValue };
  const payload = construirPayload(d);
  const qrThumb = await generarQRDataURL(payload, 120);

  items.push({ ...d, payload, qr: qrThumb });
  renderManifest();

  document.getElementById('confirmText').textContent =
    `Agregado: ${d.nombre} (código ${d.codigo.padStart(6,'0')}). ¿Deseas agregar otro instrumento?`;
  document.getElementById('confirmBox').classList.add('show');

  document.getElementById('f-codigo').value = '';
  document.getElementById('f-nombre').value = '';
  document.getElementById('f-cantidad').value = '';
  setImplant('N');
  document.getElementById('f-codigo').focus();
}

function hideConfirm(){
  document.getElementById('confirmBox').classList.remove('show');
}

function eliminarItem(idx){
  items.splice(idx,1);
  renderManifest();
}

function renderManifest(){
  const wrap = document.getElementById('manifest');
  const empty = document.getElementById('emptyState');
  const footer = document.getElementById('footerActions');
  document.getElementById('countLabel').textContent = items.length + (items.length===1 ? ' registrada' : ' registradas');

  if(items.length === 0){
    wrap.innerHTML = '';
    empty.style.display = 'block';
    footer.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  footer.style.display = 'flex';

  wrap.innerHTML = items.map((it, idx)=>`
    <div class="manifest-item">
      <div class="num">${String(idx+1).padStart(2,'0')}</div>
      <div class="thumb"><img src="${it.qr}" alt="QR"></div>
      <div class="meta">
        <div class="name">${it.nombre}</div>
        <div class="sub"><span class="code">${it.codigo.padStart(6,'0')}</span> · ${it.cantidad} instr. · ${it.lavado} · ${it.esteril}</div>
      </div>
      <div class="flag ${it.implantes==='S' ? 'implant' : 'noimplant'}">${it.implantes==='S' ? 'IMPLANTE' : 'sin implante'}</div>
      <button class="btn-danger-text" onclick="eliminarItem(${idx})">Quitar</button>
    </div>
  `).join('');
}

async function irADocumento(){
  if(items.length === 0){
    alert('Agrega al menos un instrumento antes de generar el documento.');
    return;
  }
  hideConfirm();

  const tbody = document.getElementById('docTableBody');
  const rows = await Promise.all(items.map(async (it)=>{
    const qrBig = await generarQRDataURL(it.payload, 160);
    return `
      <tr>
        <td class="code">${it.codigo.padStart(6,'0')}</td>
        <td>${it.nombre}</td>
        <td>${it.cantidad}</td>
        <td>${it.lavado}</td>
        <td>${it.esteril}</td>
        <td class="${it.implantes==='S' ? 'implant-yes' : ''}">${it.implantes==='S' ? 'Sí' : 'No'}</td>
        <td class="qr"><img src="${qrBig}" alt="QR ${it.codigo}"></td>
      </tr>`;
  }));
  tbody.innerHTML = rows.join('');

  const now = new Date();
  document.getElementById('docMeta').innerHTML =
    `Generado: ${now.toLocaleDateString('es-PA')} ${now.toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit'})}<br>${items.length} bandeja(s)`;

  document.getElementById('formView').style.display = 'none';
  document.getElementById('printView').classList.add('show');
  window.scrollTo(0,0);
}

function volverAlFormulario(){
  document.getElementById('printView').classList.remove('show');
  document.getElementById('formView').style.display = 'block';
}

function descargarHTML(){
  const docHTML = document.getElementById('printView').outerHTML;
  const standalone = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
  <title>Bandejas ingresadas a lavado</title>
  <style>
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#F5F7F6;color:#16302E;margin:0;padding:28px 20px;}
    .wrap{max-width:760px;margin:0 auto;}
    .doc-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0F4C4C;padding-bottom:12px;margin-bottom:18px;}
    .doc-head h1{font-size:18px;margin:0;color:#0A3838;}
    .eyebrow{font-family:monospace;font-size:11px;color:#5F7472;text-transform:uppercase;letter-spacing:.08em;}
    .meta{font-family:monospace;font-size:11px;color:#5F7472;text-align:right;}
    table.doc-table{width:100%;border-collapse:collapse;font-size:12.5px;}
    table.doc-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#5F7472;border-bottom:2px solid #0F4C4C;padding:6px 8px;}
    table.doc-table td{padding:8px;border-bottom:1px solid #D8E1DF;vertical-align:middle;}
    table.doc-table td.code{font-family:monospace;color:#3D7A8C;}
    table.doc-table td.qr img{width:46px;height:46px;display:block;}
    table.doc-table tr td.implant-yes{color:#B3423A;font-weight:700;}
    .no-print{display:none;}
  </style></head><body><div class="wrap">${docHTML}</div></body></html>`;

  const blob = new Blob([standalone], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `bandejas_lavado_${fecha}.html`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
